<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="public-shell">
      <header class="public-nav">
        <span class="brand">
          <span class="brand-ticket">Ticket</span
          ><span class="brand-triage">Triage.</span>
        </span>
        <nav class="public-nav-links">
          <a class="nav-pill" href="signup">SIGN UP</a>
          <a class="nav-link" href="signin">SIGN IN</a>
        </nav>
      </header>
      <main class="public-main">
        <form class="auth-card" id="signupForm">
          <h1>Create New Account</h1>
          <div class="form-group">
            <label>Name</label
            ><input
              class="form-control"
              placeholder="Enter your name"
              required
            />
          </div>
          <div class="form-group">
            <label>Email address</label
            ><input
              class="form-control"
              type="email"
              placeholder="Enter your email address"
              required
            />
          </div>
          <div class="form-group">
            <label>Password</label
            ><input
              class="form-control"
              type="password"
              placeholder="Enter password"
              required
            />
          </div>
          <div class="form-group">
            <label>Retype password</label
            ><input
              class="form-control"
              type="password"
              placeholder="Confirm password"
              required
            />
          </div>
          <button class="btn-primary" style="width: 100%" type="submit">
            Sign up
          </button>
          <div class="auth-note">
            Already have an account? <a href="signin">Sign In</a>
          </div>
        </form>
      </main>
      <footer class="public-footer">
        © 2026 TicketTriage. All Rights Reserved
      </footer>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
