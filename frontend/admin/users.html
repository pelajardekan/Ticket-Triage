<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Users</title>
  <link rel="stylesheet" href="../css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
</head>
<body class="admin-protected" data-role="admin">
  <div class="app-shell">
    <div id="sidebar-container" data-sidebar="admin"></div>
    <main class="main-area">
      <div id="topbar-container" data-role="admin"></div>
      <section class="content">
        <h1 class="page-title">Manage Users</h1>
        <div class="subtitle">View everyone who has submitted a support ticket.</div>
        <div class="filters">
          <input
            id="userSearch"
            class="form-control"
            type="search"
            placeholder="Search by name or email"
          />
          <button class="btn-outline" id="clearUserSearch" type="button">
            Clear
          </button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Tickets</th>
                <th>Last submitted</th>
              </tr>
            </thead>
            <tbody data-user-body></tbody>
          </table>
        </div>
        <div class="table-footer">
          <div data-user-count>
            Loading users...
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script type="module" src="../js/admin-auth.js"></script>
  <script type="module" src="../js/admin-users.js"></script>
</body>
</html>
