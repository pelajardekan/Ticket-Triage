<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tickets</title>
  <link rel="stylesheet" href="../css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
</head>
<body class="admin-protected" data-role="admin">
  <div class="app-shell">
    <div id="sidebar-container" data-sidebar="admin"></div>
    <main class="main-area">
      <div id="topbar-container" data-role="admin"></div>
      <section class="content">
        <h1 class="page-title">Admin Review</h1>
        <div class="subtitle">Review categorised tickets and move them through the support workflow.</div>
        <div class="filters">
          <select id="filterCategory" class="form-control">
            <option value="All">All Categories</option>
          </select>
          <select id="filterPriority" class="form-control">
            <option value="All">All Priorities</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
          <select id="filterStatus" class="form-control">
            <option value="All">All Statuses</option>
          </select>
          <button class="btn-outline" id="clearFilters">
            Clear Filters
          </button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ticket ID</th>
                <th>Requester</th>
                <th>Title</th>
                <th>Category</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Submitted On</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody data-ticket-body></tbody>
          </table>
        </div>
        <div class="table-footer">
          <div data-ticket-count>
            Loading tickets...
          </div>
          <div class="pagination">
            <button id="previousPage">
              &lt;
            </button>

            <div id="pageNumbers"></div>

            <button id="nextPage">
              &gt;
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script type="module" src="../js/admin-auth.js"></script>
  <script type="module" src="../js/admin-lists.js"></script>
</body>
</html>
