                  Remove photo
                </div>
              </div>
            </div>
            <div class="basic-card">
              <h2>Basic Information</h2>
              <label><strong>Name</strong></label
              ><input class="form-control" value="Fatiha Syuhada" /><label
                ><strong>Email Address</strong></label
              ><input class="form-control" value="fatihasyuhadazz@gmail.com" />
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
