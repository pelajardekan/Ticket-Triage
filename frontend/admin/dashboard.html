<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-container" data-sidebar="admin"></div>
      <main class="main-area">
        <div id="topbar-container" data-role="admin"></div>
        <section class="content">
          <h1 class="page-title">Dashboard</h1>
          <div class="subtitle">Overview of all support tickets</div>
          <div class="stats">
            <div class="stat-card total">
              <div class="stat-label" style="color: #f0c82f">TOTAL TICKETS</div>
              <div class="stat-number">10</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">NEW</div>
              <div class="stat-number">1</div>
            </div>
            <div class="stat-card progress">
              <div class="stat-label" style="color: #6047a8">IN PROGRESS</div>
              <div class="stat-number">3</div>
            </div>
            <div class="stat-card categorised">
              <div class="stat-label" style="color: #bd4b47">CATEGORISED</div>
              <div class="stat-number">2</div>
            </div>
            <div class="stat-card resolved">
              <div class="stat-label" style="color: #278e64">RESOLVED</div>
              <div class="stat-number">4</div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>
