<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Submit a Ticket</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-container"></div>
      <main class="main-area">
        <div id="topbar-container" data-role="student"></div>
        <section class="content">
          <h1 class="page-title">Submit a Ticket</h1>
          <div class="subtitle">
            Please provide as much detail as possible so we can help you better.
          </div>
          <form id="ticketForm">
            <div class="grid-2">
              <div>
                <div class="form-group">
                  <label>Name <span style="color: red">*</span></label
                  ><input
                    class="form-control"
                    placeholder="Enter your name"
                    required
                  />
                </div>
                <div class="form-group">
                  <label>Email Address <span style="color: red">*</span></label
                  ><input
                    class="form-control"
                    type="email"
                    placeholder="Enter your email address"
                    required
                  />
                </div>
                <div class="form-group">
                  <label>Title <span style="color: red">*</span></label
                  ><input
                    class="form-control"
                    placeholder="Brief summary of your issue"
                    required
                  />
                </div>
                <div class="form-group">
                  <label>Description <span style="color: red">*</span></label
                  ><textarea
                    class="form-control"
                    id="description"
                    maxlength="200"
                    placeholder="Please describe your issue in detail"
                    required
                  ></textarea>
                  <div id="counter" style="color: #666; margin-top: 6px">
                    0/200 characters
                  </div>
                </div>
              </div>
              <div>
                <div class="form-group">
                  <label>Priority (Optional)</label
                  ><select class="form-control">
                    <option>Select priority</option>
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Category (Optional, leave blank to auto-detect)</label
                  ><select class="form-control">
                    <option>Select category</option>
                    <option>IT Support</option>
                    <option>Course registration</option>
                    <option>Library Services</option>
                  </select>
                </div>
                <div class="info-box">
                  <div class="info-icon">ⓘ</div>
                  <div>
                    Our system will automatically suggest the most relevant
                    category based on description
                  </div>
                </div>
              </div>
            </div>
            <div class="form-actions">
              <button class="btn-primary" type="submit">Submit</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>
