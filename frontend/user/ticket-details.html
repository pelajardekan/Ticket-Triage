<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ticket Details</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="main-area">
      <div id="topbar-container" data-role="student"></div>
      <section class="content">
        <a class="back-link" href="/lists">
          <i class="fa-solid fa-chevron-left"></i>
          Back
        </a>
        <div class="ticket-card" id="ticket-card">
          <div class="ticket-card-header">
            <div>
              <span class="ticket-id" id="ticket-id">
                Loading...
              </span>
              <span class="badge" id="ticket-status">
              </span>
            </div>
            <div id="submitted-on"></div>
          </div>
          <div class="ticket-body">
            <div class="label">
              Title
            </div>
            <div id="ticket-title">
              —
            </div>
            <div class="label">
              Category (Suggested)
            </div>
            <div id="ticket-category" style="color:#315db7; font-weight:700;">
              —
            </div>
            <div class="label">
              Priority
            </div>
            <div>
              <span class="badge" id="ticket-priority">
                —
              </span>
            </div>
            <div class="label">
              Description
            </div>
            <div id="ticket-description">
              —
            </div>
          </div>
        </div>
        <div id="ticket-error" style="display:none;">
        </div>
      </section>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script type="module" src="../js/details.js">
  </script>

</body>

</html>
