<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ticket Details</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-container"></div>
      <main class="main-area">
        <div id="topbar-container" data-role="student"></div>
        <section class="content">
          <a class="back-link" href="tickets.html">← Back</a>
          <div class="ticket-card">
            <div class="ticket-card-header">
              <div>
                <span class="ticket-id">TKT-20261008-0001</span>
                <span class="badge categorised">Categorised</span>
              </div>
              <div>Submitted On: 10 August 2026, 08:00 AM</div>
            </div>
            <div class="ticket-body">
              <div class="label">Title</div>
              <div>Cannot access campus Wi-Fi</div>
              <div class="label">Category (Suggested)</div>
              <div style="color: #315db7; font-weight: 700">IT Support</div>
              <div class="label">Priority</div>
              <div><span class="badge medium">Medium</span></div>
              <div class="label">Description</div>
              <div>
                I cannot connect to the campus Wi-Fi from my laptop.<br />I have
                tried restarting but the issue continues.
              </div>
            </div>
            <div class="ticket-actions">
              <button class="btn-danger">Delete</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>
