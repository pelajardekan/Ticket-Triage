<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin review &middot; TicketTriage</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="brand">Ticket<span>Triage</span></div>
    <nav class="site">
      <a href="/index.html">Submit a ticket</a>
      <a href="/admin.html" class="active">Admin review</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Ticket review</h1>
    <p class="lede">Filter incoming tickets, check how each one was categorised, and move it through the workflow.</p>

    <div id="banner"></div>
    <div class="stats" id="stats"></div>

    <div class="card">
      <div class="filters">
        <div>
          <label for="f-category">Category</label>
          <select id="f-category"><option value="">All categories</option></select>
        </div>
        <div>
          <label for="f-status">Status</label>
          <select id="f-status"><option value="">All statuses</option></select>
        </div>
        <div>
          <label for="f-email">Email contains</label>
          <input id="f-email" placeholder="aiman@">
        </div>
        <div>
          <label for="f-q">Search text</label>
          <input id="f-q" placeholder="wi-fi">
        </div>
        <div style="display:flex;gap:8px;">
          <button id="apply">Apply</button>
          <button id="clear" class="ghost">Clear</button>
        </div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;align-items:end;flex-wrap:wrap;">
        <div style="flex:1;min-width:220px;max-width:340px;">
          <label for="admin-key">Admin key <span class="hint">- only if ADMIN_API_KEY is set</span></label>
          <input id="admin-key" type="password" placeholder="leave blank in local demo mode">
        </div>
        <button id="refresh" class="ghost">Refresh</button>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden;">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Submitted</th>
              <th>Requester</th>
              <th>Title</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th style="min-width:220px;">Actions</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="7" class="muted" style="padding:22px;">Loading tickets...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<footer class="site">
  <div class="wrap">AI-200 Capstone &middot; TicketTriage &middot; Azure free-tier reference build</div>
</footer>

<script type="module" src="/js/admin.js"></script>
</body>
</html>
